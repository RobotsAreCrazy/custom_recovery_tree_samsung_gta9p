name: OrangeFox Build - Final Zero-File Strategy v4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup & Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -a -f
          sudo apt-get clean

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 python2 gcc clang libssl-dev
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Sync OrangeFox
        run: |
          # 1. Setup the target workspace
          mkdir -p /home/runner/fox_12.1
          
          # 2. Clone the sync tool repo
          git clone https://gitlab.com/OrangeFox/sync.git ~/orangefox_sync
          
          # 3. Locate the script and its folder (crucial for patches)
          SYNC_SCRIPT=$(find ~/orangefox_sync -name "orangefox_sync.sh" | head -n 1)
          SYNC_DIR=$(dirname "$SYNC_SCRIPT")
          chmod +x "$SYNC_SCRIPT"
          
          # 4. CD into the sync tool directory so the script sees the 'patches' folder
          # But tell it to download the 45GB source into our build path
          cd "$SYNC_DIR"
          /bin/bash ./orangefox_sync.sh --branch 12.1 --path /home/runner/fox_12.1

      - name: Force-Inject Device Tree (No-Script Mode)
        run: |
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p -b twrp-12.1 ~/temp_tree
          mkdir -p /home/runner/fox_12.1/device/samsung/gta9p
          cp -rf ~/temp_tree/* /home/runner/fox_12.1/device/samsung/gta9p/
          
          # DELETE the problematic script to prevent 'Exit 1' during lunch
          rm -f /home/runner/fox_12.1/device/samsung/gta9p/vendorsetup.sh
          echo "Tree injected. Script deleted to bypass Exit 1."

      - name: Build OrangeFox
        run: |
          cd /home/runner/fox_12.1
          # Manual Variable Injection to replace vendorsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=gta9p
          export LC_ALL=C
          export FOX_USE_TWRP_DT=1
          export OF_MAINTAINER="RobotsAreCrazy"
          
          source build/envsetup.sh
          lunch twrp_gta9p-eng
          mka recoveryimage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-A9P-Final
          path: |
            /home/runner/fox_12.1/out/target/product/gta9p/OrangeFox*.zip
            /home/runner/fox_12.1/out/target/product/gta9p/recovery.img
