name: OrangeFox Build - v59 Final Interception

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4

      - name: Cleanup & Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/share/swift

      - name: Set up Build Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev repo rsync
          # This fix ensures we don't hang for 5 hours like in 1000025314.jpg

      - name: Sync OrangeFox
        run: |
          # ACTUAL SYNC COMMANDS
          mkdir ~/fox
          cd ~/fox
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_12.1 --depth=1
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p.git -b twrp-12.1 device/samsung/gta9p

      - name: v59 Interception Fix
        run: |
          # THIS IS THE KEY FIX FOR THE 52-MINUTE ERROR
          cd ~/fox
          echo "Clearing problematic vendor directories..."
          rm -rf out/target/product/gta9p/vendor
          # Add any other symlink fixes here

      - name: Build Execution
        run: |
          cd ~/fox
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_VERSION="v59_Final"
          # Using eng build for the 4gb tablet to keep it simple
          lunch twrp_gta9p-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-v59-Final-gta9p
          path: |
            /home/runner/fox/out/target/product/gta9p/OrangeFox*.zip
            /home/runner/fox/out/target/product/gta9p/recovery.img
