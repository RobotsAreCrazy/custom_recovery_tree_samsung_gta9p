name: OrangeFox Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup and Setup
        run: |
          sudo apt update
          sudo apt install -y git aria2 python3-pip gperf libxml2-utils rsync
          git config --global user.name "RobotsAreCrazy"
          git config --global user.email "robotsarecrazy@github.com"

      - name: Manual Sync
        run: |
          mkdir ~/fox_12.1 && cd ~/fox_12.1
          # Initialize minimal manifest manually to skip the broken patch script
          repo init -u https://gitlab.com/OrangeFox/manifest.git -b fox_12.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          
          # Clone your device tree
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p -b twrp-12.1 device/samsung/gta9p

      - name: Build
        run: |
          cd ~/fox_12.1
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_DT=1
          lunch twrp_gta9p-eng
          mka recoveryimage
