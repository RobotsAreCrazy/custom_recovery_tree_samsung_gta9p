name: OrangeFox Build (Stabilized)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt update
          # dos2unix is the secret weapon to fix the 'exit code 1'
          sudo apt install -y git aria2 python3-pip gperf libxml2-utils rsync curl bc zip unzip python-is-python3 dos2unix
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          git config --global user.name "RobotsAreCrazy"
          git config --global user.email "robotsarecrazy@github.com"

      - name: Sync OrangeFox 12.1
        run: |
          mkdir -p /home/runner/fox_12.1
          git clone https://gitlab.com/OrangeFox/sync.git ~/orangefox_sync
          cd ~/orangefox_sync
          ./orangefox_sync.sh --branch 12.1 --path /home/runner/fox_12.1
          
          # Clone your RECTIFIED tree
          cd /home/runner/fox_12.1
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p -b twrp-12.1 device/samsung/gta9p
          
          # AUTO-FIX: This removes any hidden Windows characters from your vendorsetup.sh
          dos2unix device/samsung/gta9p/vendorsetup.sh
          touch device/samsung/gta9p/OrangeFoxConfig.sh

      - name: Build
        run: |
          cd /home/runner/fox_12.1
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_DT=1
          export LC_ALL="C"
          
          # If the complex script fails, we fallback to a simple lunch command
          lunch twrp_gta9p-eng || (echo "Complex script failed, trying simple lunch..." && echo "add_lunch_combo twrp_gta9p-eng" > device/samsung/gta9p/vendorsetup.sh && lunch twrp_gta9p-eng)
          
          mka recoveryimage
