name: OrangeFox Build - Final v18

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup & Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -a -f
          sudo apt-get clean

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 python2 gcc clang libssl-dev
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Sync OrangeFox
        run: |
          mkdir -p /home/runner/fox_12.1
          git clone https://gitlab.com/OrangeFox/sync.git ~/orangefox_sync
          SYNC_SCRIPT=$(find ~/orangefox_sync -name "orangefox_sync.sh" | head -n 1)
          chmod +x "$SYNC_SCRIPT"
          cd $(dirname "$SYNC_SCRIPT")
          /bin/bash ./orangefox_sync.sh --branch 12.1 --path /home/runner/fox_12.1 || true

      - name: Force-Inject & Build
        run: |
          cd /home/runner/fox_12.1
          
          # 1. Clean and Clone
          rm -rf device/samsung/gta9p
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p -b twrp-12.1 device/samsung/gta9p
          
          # 2. Fix the "OrangeFox Tree" structure
          # Sometimes trees have a nested folder; we ensure the .mk files are in the root
          DEVICE_PATH="device/samsung/gta9p"
          if [ -d "$DEVICE_PATH/custom_recovery_tree_samsung_gta9p" ]; then
            mv $DEVICE_PATH/custom_recovery_tree_samsung_gta9p/* $DEVICE_PATH/
          fi
          
          # 3. Create the missing link
          rm -f $DEVICE_PATH/vendorsetup.sh
          echo 'PRODUCT_MAKEFILES := $(LOCAL_DIR)/twrp_gta9p.mk' > $DEVICE_PATH/AndroidProducts.mk
          echo 'COMMON_LUNCH_CHOICES := twrp_gta9p-eng' >> $DEVICE_PATH/AndroidProducts.mk
          
          # 4. Environment variables for Fox 12.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=gta9p
          export LC_ALL=C
          export FOX_USE_TWRP_DT=1
          export OF_MAINTAINER="RobotsAreCrazy"
          export SKIP_API_CHECK=true
          
          # 5. Build with "Fox Tooling" enabled
          /bin/bash -c "source build/envsetup.sh && lunch twrp_gta9p-eng && mka recoveryimage -j$(nproc --all)"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-A9P-Final
          path: |
            /home/runner/fox_12.1/out/target/product/gta9p/OrangeFox*.zip
            /home/runner/fox_12.1/out/target/product/gta9p/recovery.img
