name: OrangeFox Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build OrangeFox
        uses: NSR-XINE/OrangeFox-Action-Builder@master
        with:
          args: >
            --branch 12.1
            --device gta9p
            --path device/samsung/gta9p
            --owner RobotsAreCrazy
