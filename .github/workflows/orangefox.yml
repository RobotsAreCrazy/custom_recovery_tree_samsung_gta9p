name: OrangeFox Build - GitLab Mirror Bypass

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev rsync
          git config --global user.email "builder@orangefox.org"
          git config --global user.name "OrangeFox-Builder"

      - name: Sync from GitLab Mirrors
        run: |
          mkdir ~/fox && cd ~/fox
          
          # We use GitLab mirrors because GitHub is blocking your access
          # These are public and don't require your GitHub PAT
          git clone --depth=1 https://gitlab.com/OrangeFox/build.git build/make
          git clone --depth=1 https://gitlab.com/OrangeFox/system_core.git system/core
          
          # Clone your device tree from GitHub (this is YOUR repo, so it will work)
          git clone --depth=1 https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p.git -b twrp-12.1 device/samsung/gta9p

      - name: Build Execution
        run: |
          cd ~/fox
          if [ -d build/make ]; then
            source build/make/envsetup.sh
            export ALLOW_MISSING_DEPENDENCIES=true
            lunch twrp_gta9p-eng
            mka recoveryimage -j$(nproc --all)
          else
            echo "GitLab mirrors also unreachable. This usually means a local network/runner issue."
            exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-GitLab-Build
          path: /home/runner/fox/out/target/product/gta9p/*.img
