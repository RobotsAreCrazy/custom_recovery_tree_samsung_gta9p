name: OrangeFox - Community Mirror Sync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Your Project
        uses: actions/checkout@v4

      - name: Prep Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev rsync
          # These lines are critical to stop the "Check credentials" error in 1000025371.jpg
          git config --global user.email "builder@example.com"
          git config --global user.name "Builder"
          git config --global color.ui false

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Execute Community Sync
        run: |
          # Runs the updated orangefox_sync.sh with the public mirror
          bash orangefox_sync.sh

      - name: Build Full OrangeFox
        run: |
          cd ~/fox/source
          # Inject your A9+ device tree
          mkdir -p device/samsung/gta9p
          cp -r $GITHUB_WORKSPACE/* device/samsung/gta9p/
          
          source build/make/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_VERSION="R11.1"
          lunch twrp_gta9p-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Finished Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Community-GTA9P
          path: /home/runner/fox/source/out/target/product/gta9p/*.img
