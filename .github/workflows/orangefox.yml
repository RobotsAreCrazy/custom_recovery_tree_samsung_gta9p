name: OrangeFox Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y git aria2 python3-pip gperf libxml2-utils rsync curl bc zip unzip python-is-python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          git config --global user.name "RobotsAreCrazy"
          git config --global user.email "robotsarecrazy@github.com"

      - name: Sync OrangeFox Source
        run: |
          mkdir -p /home/runner/fox_12.1
          git clone https://gitlab.com/OrangeFox/sync.git ~/orangefox_sync
          cd ~/orangefox_sync
          ./orangefox_sync.sh --branch 12.1 --path /home/runner/fox_12.1
          
          # CRITICAL: Manually pull the missing vendor and core dependencies
          cd /home/runner/fox_12.1
          git clone https://github.com/OrangeFoxRecovery/vendor_recovery.git -b fox_12.1 vendor/recovery
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p -b twrp-12.1 device/samsung/gta9p

      - name: Build
        run: |
          cd /home/runner/fox_12.1
          set -e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_DT=1
          # This tells the builder exactly where to look for the tablet's config
          lunch twrp_gta9p-eng
          mka recoveryimage
