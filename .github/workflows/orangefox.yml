name: OrangeFox Build - Manual Sync Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4

      - name: Cleanup & Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/share/swift /usr/local/share/boost

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev rsync

      - name: Manual Source Sync
        run: |
          mkdir ~/fox && cd ~/fox
          
          # Use the token directly in the URL for the most reliable auth
          # We are only grabbing the absolute essentials to keep it light
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/OrangeFoxRecovery/build.git build/make
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/OrangeFoxRecovery/system_core.git system/core
          
          # Manually clone your device tree
          git clone --depth=1 https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p.git -b twrp-12.1 device/samsung/gta9p

      - name: Build Execution
        run: |
          cd ~/fox
          # We have to see if these two components are enough to start the environment
          if [ -f build/envsetup.sh ]; then
            source build/envsetup.sh
            export ALLOW_MISSING_DEPENDENCIES=true
            lunch twrp_gta9p-eng
            mka recoveryimage -j$(nproc --all)
          else
            echo "Critical build files missing. Manual sync needs more paths."
            exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Manual-Build
          path: /home/runner/fox/out/target/product/gta9p/*.img
