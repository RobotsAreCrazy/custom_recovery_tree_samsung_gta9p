name: OrangeFox Build - v57 Pre-emptive Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4

      - name: Cleanup & Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -a -f
          sudo apt-get clean

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 python2 gcc clang libssl-dev
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Sync OrangeFox
        run: |
          mkdir -p /home/runner/fox
          git clone https://gitlab.com/OrangeFox/sync.git ~/orangefox_sync
          SYNC_SCRIPT=$(find ~/orangefox_sync -name "orangefox_sync.sh" | head -n 1)
          chmod +x "$SYNC_SCRIPT"
          cd $(dirname "$SYNC_SCRIPT")
          /bin/bash ./orangefox_sync.sh --branch 12.1 --path /home/runner/fox || true

      - name: Build Execution
        run: |
          # 1. Inject Tree
          mkdir -p /home/runner/fox/device/samsung/gta9p
          cd /home/runner/fox/device/samsung/gta9p
          git init
          git remote add origin https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p.git
          git fetch origin twrp-12.1
          git reset --hard FETCH_HEAD
          
          # 2. THE v57 PRE-EMPTIVE FIX
          # We force the symlink into the source directory so the build tool 
          # accepts it as "truth" before the mapping starts.
          cd /home/runner/fox
          rm -rf device/samsung/gta9p/recovery/root/vendor
          mkdir -p device/samsung/gta9p/recovery/root
          ln -sf /system/vendor device/samsung/gta9p/recovery/root/vendor

          # 3. Patching
          find bootable/recovery -name "orangefox.mk" -exec sed -i 's/\$(error.*FOX_VERSION.*is obsolete.*)/$(warning Obsolete check bypassed)/g' {} +
          
          cat << 'EOF' > builder.sh
          #!/bin/bash
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=gta9p
          export LC_ALL=C
          export FOX_USE_TWRP_DT=1
          export OF_MAINTAINER="RobotsAreCrazy"
          export SKIP_API_CHECK=true
          export FOX_VANILLA_BUILD=1
          export FOX_DRASTIC_SIZE_REDUCTION=1
          
          # Use LZMA to keep image size small for the 4GB variant
          export OF_USE_LZMA_COMPRESSION=1

          source build/envsetup.sh
          lunch twrp_gta9p-eng

          # Build everything in one shot
          mka recoveryimage -j$(nproc --all)
          EOF

          chmod +x builder.sh
          ./builder.sh

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-v57-Final
          path: |
            /home/runner/fox/out/target/product/gta9p/OrangeFox*.zip
            /home/runner/fox/out/target/product/gta9p/recovery.img
