name: OrangeFox Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y git aria2 python3-pip gperf libxml2-utils rsync curl bc zip unzip
          # Setup git so the sync script doesn't complain
          git config --global user.name "RobotsAreCrazy"
          git config --global user.email "robotsarecrazy@github.com"

      - name: Sync OrangeFox Source
        run: |
          mkdir -p ~/fox_12.1
          # Get the official sync script
          git clone https://gitlab.com/OrangeFox/sync.git ~/orangefox_sync
          cd ~/orangefox_sync
          # This script handles all the 'repo' and GitLab authentication internally
          ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1
          
          # Now add your specific device tree
          cd ~/fox_12.1
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p -b twrp-12.1 device/samsung/gta9p

      - name: Build
        run: |
          cd ~/fox_12.1
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_DT=1
          lunch twrp_gta9p-eng
          mka recoveryimage
