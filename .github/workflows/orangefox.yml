name: OrangeFox Build - v59 Final Interception

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: read # Explicitly gives the runner permission to read repos

    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4

      - name: Cleanup & Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/share/swift

      - name: Set up Build Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev rsync
          
          # Force identity to satisfy standard Git requirements
          git config --global user.email "orangefox@build.bot"
          git config --global user.name "OrangeFox-Builder"
          git config --global color.ui false

      - name: Sync OrangeFox
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          
          mkdir ~/fox
          cd ~/fox

          # FIX FOR 1000025329.jpg:
          # We skip the complex 'repo init' authentication loop entirely
          mkdir -p .repo
          git clone --depth=1 https://github.com/OrangeFoxRecovery/Manifest.git -b fox_12.1 .repo/manifests
          ln -s manifests/default.xml .repo/manifest.xml
          
          # Tell repo to use the local manifest we just cloned
          ~/bin/repo init -u https://github.com/OrangeFoxRecovery/Manifest.git -b fox_12.1
          
          # Sync with j1 to prevent GitHub from flagging the runner as a bot/spam
          ~/bin/repo sync -c -j1 --force-sync --no-clone-bundle --no-tags
          
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p.git -b twrp-12.1 device/samsung/gta9p

      - name: v59 Interception Fix
        run: |
          cd ~/fox
          rm -rf out/target/product/gta9p/vendor
          echo "Fixed v59 directory conflict."

      - name: Build Execution
        run: |
          cd ~/fox
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_VERSION="v59_Final"
          lunch twrp_gta9p-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-v59-Final-gta9p
          path: |
            /home/runner/fox/out/target/product/gta9p/OrangeFox*.zip
            /home/runner/fox/out/target/product/gta9p/recovery.img
