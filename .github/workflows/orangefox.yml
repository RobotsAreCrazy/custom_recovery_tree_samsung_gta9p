name: OrangeFox Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recovery Build
        uses: NSR-XINE/OrangeFox-Action-Builder@main
        with:
          MANIFEST_BRANCH: '12.1'
          DEVICE_TREE: 'https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p'
          DEVICE_TREE_BRANCH: 'twrp-12.1'
          DEVICE_PATH: 'device/samsung/gta9p'
          DEVICE_NAME: 'gta9p'
          BUILD_TARGET: 'recovery'
