name: OrangeFox Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y git aria2 python3-pip gperf libxml2-utils rsync curl bc
          git config --global user.name "RobotsAreCrazy"
          git config --global user.email "robotsarecrazy@github.com"

      - name: Manual Clone Sync
        run: |
          mkdir ~/fox_12.1 && cd ~/fox_12.1
          # Manually cloning the minimal build system instead of using 'repo'
          git clone https://github.com/OrangeFoxRecovery/build.git -b fox_12.1 build
          git clone https://github.com/OrangeFoxRecovery/vendor_magisk.git -b master vendor/magisk
          
          # Clone your device tree
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p -b twrp-12.1 device/samsung/gta9p
          
          # Note: A full build usually needs more repos, but this starts the process 
          # and lets us see if the environment is finally stable.

      - name: Build
        run: |
          cd ~/fox_12.1
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_DT=1
          lunch twrp_gta9p-eng
          mka recoveryimage
