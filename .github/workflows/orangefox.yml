name: OrangeFox Build - Final v8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup & Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -a -f
          sudo apt-get clean

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 python2 gcc clang libssl-dev
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Sync OrangeFox
        run: |
          mkdir -p /home/runner/fox_12.1
          git clone https://gitlab.com/OrangeFox/sync.git ~/orangefox_sync
          SYNC_SCRIPT=$(find ~/orangefox_sync -name "orangefox_sync.sh" | head -n 1)
          chmod +x "$SYNC_SCRIPT"
          cd $(dirname "$SYNC_SCRIPT")
          /bin/bash ./orangefox_sync.sh --branch 12.1 --path /home/runner/fox_12.1

      - name: Force-Inject Device Tree
        run: |
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p -b twrp-12.1 ~/temp_tree
          DEVICE_PATH="/home/runner/fox_12.1/device/samsung/gta9p"
          mkdir -p $DEVICE_PATH
          cp -rf ~/temp_tree/* $DEVICE_PATH/
          
          # 1. KILL the obsolete vendorsetup.sh to stop the error in Image 217
          rm -f $DEVICE_PATH/vendorsetup.sh
          
          # 2. CREATE AndroidProducts.mk (The modern way)
          echo 'PRODUCT_MAKEFILES := $(LOCAL_DIR)/omni_gta9p.mk' > $DEVICE_PATH/AndroidProducts.mk
          echo 'COMMON_LUNCH_CHOICES := omni_gta9p-eng' >> $DEVICE_PATH/AndroidProducts.mk
          
          # 3. Ensure BoardConfig is ready
          echo "FOX_BUILD_DEVICE=gta9p" >> $DEVICE_PATH/BoardConfig.mk

      - name: Build OrangeFox
        run: |
          cd /home/runner/fox_12.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=gta9p
          export LC_ALL=C
          export FOX_USE_TWRP_DT=1
          export OF_MAINTAINER="RobotsAreCrazy"
          
          source build/envsetup.sh
          # Use 'omni_gta9p' as that is the standard OrangeFox/TWRP prefix
          lunch omni_gta9p-eng
          mka recoveryimage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-A9P-Final
          path: |
            /home/runner/fox_12.1/out/target/product/gta9p/OrangeFox*.zip
            /home/runner/fox_12.1/out/target/product/gta9p/recovery.img
