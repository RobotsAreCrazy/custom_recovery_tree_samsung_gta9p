name: OrangeFox Build - PAT Sync Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev rsync
          git config --global user.email "builder@orangefox.org"
          git config --global user.name "OrangeFox-Builder"

      - name: Sync Sources using PAT
        run: |
          mkdir ~/fox && cd ~/fox
          
          # Manually clone the absolute core necessities using your PAT
          # This bypasses all the "Repository not found" errors from 1000025350.jpg
          git clone --depth=1 https://${{ secrets.MY_PAT }}@github.com/OrangeFoxRecovery/build.git build/make
          git clone --depth=1 https://${{ secrets.MY_PAT }}@github.com/OrangeFoxRecovery/system_core.git system/core
          git clone --depth=1 https://${{ secrets.MY_PAT }}@github.com/OrangeFoxRecovery/vendor_omni.git vendor/omni
          
          # Clone your specific device tree
          git clone --depth=1 https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p.git -b twrp-12.1 device/samsung/gta9p

      - name: Build Execution
        run: |
          cd ~/fox
          # Check if the core build files actually landed
          if [ -f build/make/envsetup.sh ]; then
            source build/make/envsetup.sh
            export ALLOW_MISSING_DEPENDENCIES=true
            lunch twrp_gta9p-eng
            mka recoveryimage -j$(nproc --all)
          else
            echo "Build core missing. Ensure your PAT has 'repo' scope."
            exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-PAT-Build
          path: /home/runner/fox/out/target/product/gta9p/*.img
