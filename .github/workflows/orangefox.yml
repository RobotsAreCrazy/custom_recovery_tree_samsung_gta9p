name: OrangeFox Full - Internal Sideload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Your Files
        uses: actions/checkout@v4

      - name: Prep Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev rsync
          git config --global user.email "builder@orangefox.org"
          git config --global user.name "OrangeFox-Builder"

      - name: Execute Local Sync
        run: |
          mkdir -p ~/fox/source
          # Copy the script you uploaded into the build directory
          cp orangefox_sync.sh ~/fox/source/
          cd ~/fox/source
          chmod +x orangefox_sync.sh
          
          # This pulls the source from mirrors, not from the blocked GitHub API
          ./orangefox_sync.sh --branch 12.1 --path ~/fox/source

      - name: Build Full OrangeFox
        run: |
          cd ~/fox/source
          # Move your device tree into the synced source
          mkdir -p device/samsung/gta9p
          cp -r $GITHUB_WORKSPACE/* device/samsung/gta9p/
          
          source build/make/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_VERSION="R11.1"
          lunch twrp_gta9p-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Full-A9Plus
          path: /home/runner/fox/source/out/target/product/gta9p/*.img
