name: OrangeFox Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build OrangeFox
        uses: HazzK/OrangeFox-Builder@master
        with:
          args: >
            --branch 12.1
            --device gta9p
            --path device/samsung/gta9p
            --owner RobotsAreCrazy
