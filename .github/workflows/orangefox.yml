name: OrangeFox Build - Final v30

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4

      - name: Cleanup & Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -a -f
          sudo apt-get clean

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 python2 gcc clang libssl-dev
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Sync OrangeFox
        run: |
          mkdir -p work
          git clone https://gitlab.com/OrangeFox/sync.git ~/orangefox_sync
          SYNC_SCRIPT=$(find ~/orangefox_sync -name "orangefox_sync.sh" | head -n 1)
          chmod +x "$SYNC_SCRIPT"
          cd $(dirname "$SYNC_SCRIPT")
          /bin/bash ./orangefox_sync.sh --branch 12.1 --path $GITHUB_WORKSPACE/work || true

      - name: Inject Device Tree
        uses: actions/checkout@v4
        with:
          repository: RobotsAreCrazy/custom_recovery_tree_samsung_gta9p
          ref: twrp-12.1
          path: work/device/samsung/gta9p

      - name: Final Build
        run: |
          # 1. Identify paths based on the successful log in 1000025244.jpg
          BUILD_ROOT=$(find $GITHUB_WORKSPACE -name "envsetup.sh" | grep "build/envsetup.sh" | head -n 1 | xargs dirname | xargs dirname)
          DEVICE_PATH=$(find $GITHUB_WORKSPACE -name "twrp_gta9p.mk" | head -n 1 | xargs dirname)
          
          if [ -z "$BUILD_ROOT" ]; then echo "ERROR: Could not find build root"; exit 1; fi
          
          cd "$BUILD_ROOT"
          
          # 2. Fix Manifests
          rm -f $DEVICE_PATH/vendorsetup.sh
          echo 'PRODUCT_MAKEFILES := $(LOCAL_DIR)/twrp_gta9p.mk' > $DEVICE_PATH/AndroidProducts.mk
          echo 'COMMON_LUNCH_CHOICES := twrp_gta9p-eng' >> $DEVICE_PATH/AndroidProducts.mk
          
          # 3. Exports
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=gta9p
          export LC_ALL=C
          export FOX_USE_TWRP_DT=1
          export OF_MAINTAINER="RobotsAreCrazy"
          export SKIP_API_CHECK=true
          
          # 4. Start Compilation
          # We use a full path for source to avoid any 'no such file' errors
          /bin/bash -c "source $BUILD_ROOT/build/envsetup.sh && lunch twrp_gta9p-eng && mka recoveryimage -j$(nproc --all)"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-A9P-Final
          path: |
            **/OrangeFox*.zip
            **/recovery.img
