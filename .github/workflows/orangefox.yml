name: OrangeFox Build - Zero-File Strategy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup & Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 python2 gcc clang

      - name: Sync OrangeFox
        run: |
          mkdir -p ~/fox_12.1
          cd ~/fox_12.1
          git clone https://gitlab.com/OrangeFox/sync.git -b 12.1 ~/orangefox_sync
          python3 ~/orangefox_sync/orangefox_sync.py --branch 12.1 --path ~/fox_12.1

      - name: Force-Inject Device Tree (No-Script Mode)
        run: |
          # 1. Clone the tree
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p -b twrp-12.1 ~/temp_tree
          
          # 2. Setup target directory
          mkdir -p ~/fox_12.1/device/samsung/gta9p
          
          # 3. Copy files but DELETE the problematic script
          cp -rf ~/temp_tree/* ~/fox_12.1/device/samsung/gta9p/
          rm -f ~/fox_12.1/device/samsung/gta9p/vendorsetup.sh
          
          echo "Device tree injected. vendorsetup.sh removed to prevent Exit 1."

      - name: Build OrangeFox
        run: |
          cd ~/fox_12.1
          # Manually Inject the variables the script was supposed to handle
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=gta9p
          export LC_ALL=C
          export FOX_USE_TWRP_DT=1
          export OF_MAINTAINER="RobotsAreCrazy"
          
          # Start the build process
          source build/envsetup.sh
          lunch twrp_gta9p-eng
          mka recoveryimage

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-A9P
          path: |
            /home/runner/fox_12.1/out/target/product/gta9p/OrangeFox*.zip
            /home/runner/fox_12.1/out/target/product/gta9p/recovery.img
