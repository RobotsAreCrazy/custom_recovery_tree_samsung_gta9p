name: OrangeFox Build - Final Victory Run

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # These match your settings in 1000025358.jpg
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          persist-credentials: false

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev rsync
          git config --global user.email "builder@orangefox.org"
          git config --global user.name "OrangeFox-Builder"

      - name: Sync Sources
        run: |
          mkdir ~/fox && cd ~/fox
          # Success depends on the PAT and the Write access from 1000025358.jpg
          git clone --depth=1 https://x-access-token:${{ secrets.MY_PAT }}@github.com/OrangeFoxRecovery/build.git build/make
          git clone --depth=1 https://x-access-token:${{ secrets.MY_PAT }}@github.com/OrangeFoxRecovery/system_core.git system/core
          git clone --depth=1 https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p.git -b twrp-12.1 device/samsung/gta9p

      - name: Build Execution
        run: |
          cd ~/fox
          if [ -d build/make ]; then
            source build/make/envsetup.sh
            export ALLOW_MISSING_DEPENDENCIES=true
            lunch twrp_gta9p-eng
            mka recoveryimage -j$(nproc --all)
          else
            echo "Clone failed. If permissions are correct, double-check the PAT scope in GitHub settings."
            exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Final-Result
          path: /home/runner/fox/out/target/product/gta9p/*.img
