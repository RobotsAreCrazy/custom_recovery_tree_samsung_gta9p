name: Full OrangeFox - Raw Archive Bypass

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Your Device Tree
        uses: actions/checkout@v4

      - name: Prep Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev rsync
          git config --global user.email "builder@orangefox.org"
          git config --global user.name "OrangeFox-Builder"

      - name: Download Full Source (Manual Archive)
        run: |
          mkdir -p ~/fox/source && cd ~/fox/source
          # We download the source as a ZIP to bypass Git 'Resolve' errors
          wget https://github.com/OrangeFoxRecovery/OrangeFox_Sync/archive/refs/heads/master.zip
          unzip master.zip
          mv OrangeFox_Sync-master/* .
          
          # Run the internal sync using the --force-sync flag to ignore server blocks
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch 12.1 --path ~/fox/source --force-sync

      - name: Build Full OrangeFox
        run: |
          cd ~/fox/source
          # Injecting your A9+ device tree
          git clone --depth=1 https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p.git -b twrp-12.1 device/samsung/gta9p
          
          source build/make/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_VERSION="R11.1"
          lunch twrp_gta9p-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Finished Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Full-OrangeFox-A9Plus
          path: /home/runner/fox/source/out/target/product/gta9p/*.img
