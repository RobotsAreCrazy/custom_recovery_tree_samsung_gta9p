name: OrangeFox - 404 Bypass Success

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Your Project
        uses: actions/checkout@v4

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Prep Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev rsync
          git config --global user.email "builder@orangefox.org"
          git config --global user.name "OrangeFox-Builder"

      - name: Execute Emergency Sync
        run: |
          # Running the script you just created manually
          bash orangefox_sync.sh

      - name: Build Full OrangeFox
        run: |
          cd ~/fox/source
          # Move your Samsung device tree into the build
          mkdir -p device/samsung/gta9p
          cp -r $GITHUB_WORKSPACE/* device/samsung/gta9p/
          
          source build/make/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_VERSION="R11.1"
          lunch twrp_gta9p-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Full-A9Plus
          path: /home/runner/fox/source/out/target/product/gta9p/*.img
