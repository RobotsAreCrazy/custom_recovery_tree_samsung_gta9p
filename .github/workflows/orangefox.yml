name: OrangeFox Build - v59 Final Interception

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev rsync
          # Installs basic tools; prevents the 5-hour hang seen earlier.

      - name: Sync OrangeFox
        run: |
          # 1. Setup local repo tool
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          
          # 2. Hard-code Git Identity (Fixes the authentication error in 1000025322_2.jpg)
          git config --global user.email "orangefox@build.bot"
          git config --global user.name "OrangeFox-Builder"
          git config --global color.ui false

          mkdir ~/fox
          cd ~/fox
          
          # 3. Initialize and Sync using the GitHub Mirror
          ~/bin/repo init -u https://github.com/OrangeFoxRecovery/Manifest.git -b fox_12.1 --depth=1
          
          # 4. Use -j1 to avoid triggering security throttles
          ~/bin/repo sync -c -j1 --force-sync --no-clone-bundle --no-tags
          
          # 5. Clone your device tree
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p.git -b twrp-12.1 device/samsung/gta9p

      - name: v59 Interception Fix
        run: |
          cd ~/fox
          # Fixes the 'non-empty directory' crash that occurred at 52m
          rm -rf out/target/product/gta9p/vendor
          echo "Intercepted v59 vendor conflict."

      - name: Build Execution
        run: |
          cd ~/fox
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_VERSION="v59_Final"
          lunch twrp_gta9p-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-v59-Final-gta9p
          path: |
            /home/runner/fox/out/target/product/gta9p/OrangeFox*.zip
            /home/runner/fox/out/target/product/gta9p/recovery.img
