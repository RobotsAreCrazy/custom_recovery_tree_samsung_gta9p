name: OrangeFox Build - Final v6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup & Maximize Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -a -f
          sudo apt-get clean

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 python2 gcc clang libssl-dev
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Sync OrangeFox
        run: |
          mkdir -p /home/runner/fox_12.1
          git clone https://gitlab.com/OrangeFox/sync.git ~/orangefox_sync
          SYNC_SCRIPT=$(find ~/orangefox_sync -name "orangefox_sync.sh" | head -n 1)
          chmod +x "$SYNC_SCRIPT"
          cd $(dirname "$SYNC_SCRIPT")
          /bin/bash ./orangefox_sync.sh --branch 12.1 --path /home/runner/fox_12.1

      - name: Force-Inject Device Tree
        run: |
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p -b twrp-12.1 ~/temp_tree
          DEVICE_PATH="/home/runner/fox_12.1/device/samsung/gta9p"
          mkdir -p $DEVICE_PATH
          cp -rf ~/temp_tree/* $DEVICE_PATH/
          
          # Instead of deleting, create a CLEAN vendorsetup.sh
          # This tells 'lunch' exactly what it needs to know without buggy code
          echo 'add_lunch_combo twrp_gta9p-eng' > $DEVICE_PATH/vendorsetup.sh
          chmod +x $DEVICE_PATH/vendorsetup.sh

      - name: Build OrangeFox
        run: |
          cd /home/runner/fox_12.1
          # Essential Build Variables
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=gta9p
          export LC_ALL=C
          export FOX_USE_TWRP_DT=1
          export OF_MAINTAINER="RobotsAreCrazy"
          
          # Run the build
          source build/envsetup.sh
          lunch twrp_gta9p-eng
          mka recoveryimage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-A9P-Final
          path: |
            /home/runner/fox_12.1/out/target/product/gta9p/OrangeFox*.zip
            /home/runner/fox_12.1/out/target/product/gta9p/recovery.img
