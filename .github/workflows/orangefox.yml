name: OrangeFox Build (Integration Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y git aria2 python3-pip gperf libxml2-utils rsync curl bc zip unzip python-is-python3 dos2unix
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          git config --global user.name "RobotsAreCrazy"
          git config --global user.email "robotsarecrazy@github.com"

      - name: Sync OrangeFox
        run: |
          mkdir -p /home/runner/fox_12.1
          git clone https://gitlab.com/OrangeFox/sync.git ~/orangefox_sync
          cd ~/orangefox_sync
          ./orangefox_sync.sh --branch 12.1 --path /home/runner/fox_12.1

      - name: Force-Inject Device Tree
        run: |
          # 1. Clone your tree to a temporary spot
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p -b twrp-12.1 ~/temp_tree
          
          # 2. Force create the directory and move files in
          mkdir -p /home/runner/fox_12.1/device/samsung/gta9p
          cp -rf ~/temp_tree/* /home/runner/fox_12.1/device/samsung/gta9p/
          
          # 3. Fix the specific script that keeps crashing
          cd /home/runner/fox_12.1/device/samsung/gta9p
          echo "export ALLOW_MISSING_DEPENDENCIES=true" > vendorsetup.sh
          echo "export LC_ALL=C" >> vendorsetup.sh
          echo "true" >> vendorsetup.sh
          chmod 755 vendorsetup.sh

      - name: Build
        run: |
          cd /home/runner/fox_12.1
          # We manually source envsetup and lunch to bypass the automatic inclusion crash
          set -e
          source build/envsetup.sh
          lunch twrp_gta9p-eng
          export FOX_USE_TWRP_DT=1
          mka recoveryimage
