name: OrangeFox Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt update
          sudo apt install -y git aria2 python3-pip gperf libxml2-utils rsync
          git config --global user.name "RobotsAreCrazy"
          git config --global user.email "robotsarecrazy@github.com"

      - name: Build
        run: |
          # Download the official OrangeFox sync script
          aria2c -s16 -x16 https://gitlab.com/OrangeFox/sync/-/raw/master/orangefox_sync.sh
          bash orangefox_sync.sh --branch 12.1 --path ~/fox_12.1
          
          # Move to source and clone your tree
          cd ~/fox_12.1
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p -b twrp-12.1 device/samsung/gta9p
          
          # Start the build
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_DT=1
          export LC_ALL="C"
          lunch twrp_gta9p-eng
          mka recoveryimage
