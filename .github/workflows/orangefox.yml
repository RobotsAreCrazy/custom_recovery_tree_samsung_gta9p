name: OrangeFox Build (Nuclear Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y git aria2 python3-pip gperf libxml2-utils rsync curl bc zip unzip python-is-python3 dos2unix
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+rx ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          git config --global user.name "RobotsAreCrazy"
          git config --global user.email "robotsarecrazy@github.com"

      - name: Sync & Force-Clean Tree
        run: |
          mkdir -p /home/runner/fox_12.1
          git clone https://gitlab.com/OrangeFox/sync.git ~/orangefox_sync
          cd ~/orangefox_sync
          ./orangefox_sync.sh --branch 12.1 --path /home/runner/fox_12.1
          
          # 1. Create target folder and clone your tree
          mkdir -p /home/runner/fox_12.1/device/samsung/gta9p
          git clone https://github.com/RobotsAreCrazy/custom_recovery_tree_samsung_gta9p -b twrp-12.1 /home/runner/fox_12.1/device/samsung/gta9p
          
          # 2. NUCLEAR FIX: Wipe the local script and rewrite it perfectly for Linux
          cd /home/runner/fox_12.1/device/samsung/gta9p
          rm -f vendorsetup.sh
          cat <<EOF > vendorsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export OF_MAINTAINER="Crypton"
          export FOX_VERSION="R11.1"
          export FOX_BUILD_TYPE=beta
          export FOX_ARCH=arm64
          export FOX_VARIANT="12.1"
          export TARGET_DEVICE_ALT="gta9p"
          export OF_SCREEN_H=2400
          export OF_PATCH_AVB20=1
          export FOX_BUGGED_AOSP_ARB_WORKAROUND="1616300800"
          true
          EOF
          
          chmod +x vendorsetup.sh
          touch OrangeFoxConfig.sh

      - name: Build
        run: |
          cd /home/runner/fox_12.1
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_DT=1
          export LC_ALL="C"
          
          lunch twrp_gta9p-eng
          mka recoveryimage
